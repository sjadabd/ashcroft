server {
    listen 80;
    listen [::]:80;
    server_name ashcroft.london www.ashcroft.london;

    root /var/www/ashcroft.london;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
